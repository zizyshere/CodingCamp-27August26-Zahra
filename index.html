<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER / GREETING ===== -->
  <header class="header">
    <div class="header-top">
      <div id="datetime" class="datetime"></div>
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle light/dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>

    <div class="greeting-block">
      <h1 id="greeting-text" class="greeting-text">Good morning!</h1>
      <div class="name-row">
        <span id="greeting-name" class="greeting-name"></span>
        <button id="edit-name-btn" class="btn-link" title="Edit your name">✏️</button>
      </div>
    </div>

    <!-- Name modal -->
    <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title">What's your name?</h2>
        <input id="name-input" class="input" type="text" placeholder="Enter your name…" maxlength="40" />
        <div class="modal-actions">
          <button id="name-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button id="name-save-btn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-grid">

    <!-- FOCUS TIMER -->
    <section class="card" id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="card-title">Focus Timer</h2>
      <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled>Stop</button>
        <button id="timer-reset" class="btn btn-secondary">Reset</button>
      </div>
      <p id="timer-status" class="timer-status">Ready to focus!</p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card" id="todo-section" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="card-title">To-Do List</h2>

      <div class="todo-input-row">
        <input id="todo-input" class="input" type="text" placeholder="Add a new task…" maxlength="100" />
        <button id="todo-add-btn" class="btn btn-primary">Add</button>
      </div>
      <p id="todo-error" class="error-msg hidden" aria-live="polite"></p>

      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>

      <div class="todo-footer">
        <span id="todo-count" class="todo-count">0 tasks</span>
        <button id="todo-clear-btn" class="btn btn-danger btn-sm">Clear Done</button>
      </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="card" id="links-section" aria-labelledby="links-heading">
      <h2 id="links-heading" class="card-title">Quick Links</h2>

      <div class="links-input-row">
        <input id="link-name-input" class="input" type="text" placeholder="Label" maxlength="30" />
        <input id="link-url-input"  class="input" type="url"  placeholder="URL"  maxlength="200" />
        <button id="link-add-btn" class="btn btn-primary">Add</button>
      </div>
      <p id="link-error" class="error-msg hidden" aria-live="polite"></p>

      <div id="links-grid" class="links-grid" aria-label="Quick links"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
